<div x-data="webrtcVideoChat()" x-init="init()" class="relative bg-gray-900 rounded-2xl overflow-hidden" x-cloak>
  <!-- Connection Status -->
  <div class="absolute top-4 left-4 z-20">
    <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold"
          :class="connectionStatus === 'connected' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'">
      <span class="w-2 h-2 rounded-full" :class="connectionStatus === 'connected' ? 'bg-green-400 animate-pulse' : 'bg-yellow-400'"></span>
      <span x-text="connectionStatus === 'connected' ? 'Connecté' : 'En attente...'"></span>
    </span>
  </div>

  <!-- Main Video Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 h-[500px]">
    <!-- Remote Video (Agent/Other participant) -->
    <div class="relative bg-gray-800 rounded-xl overflow-hidden">
      <video ref="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
      <div class="absolute bottom-4 left-4">
        <span class="bg-black/50 backdrop-blur-md text-white text-sm font-medium px-3 py-1.5 rounded-full">
          {{ remote_name|default:"Agent" }}
        </span>
      </div>
      <!-- Screen Share Indicator -->
      <div x-show="isScreenSharing" class="absolute top-4 right-4">
        <span class="bg-blue-500/20 text-blue-400 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          Partage d'écran
        </span>
      </div>
    </div>

    <!-- Local Video (Self) -->
    <div class="relative bg-gray-800 rounded-xl overflow-hidden">
      <video ref="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <div class="absolute bottom-4 left-4">
        <span class="bg-black/50 backdrop-blur-md text-white text-sm font-medium px-3 py-1.5 rounded-full">
          Vous
        </span>
      </div>
      <!-- Mute Indicator -->
      <div x-show="isAudioMuted" class="absolute top-4 right-4">
        <span class="bg-red-500/20 text-red-400 text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
          Micro coupé
        </span>
      </div>
    </div>
  </div>

  <!-- Control Bar -->
  <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-4">
    <div class="flex items-center justify-between">
      <!-- Left Controls -->
      <div class="flex items-center gap-2">
        <!-- Toggle Audio -->
        <button @click="toggleAudio()" 
                class="w-12 h-12 rounded-full flex items-center justify-center transition-all"
                :class="isAudioMuted ? 'bg-red-500 hover:bg-red-600' : 'bg-white/20 hover:bg-white/30'">
          <svg x-show="!isAudioMuted" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
          <svg x-show="isAudioMuted" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
          </svg>
        </button>

        <!-- Toggle Video -->
        <button @click="toggleVideo()" 
                class="w-12 h-12 rounded-full flex items-center justify-center transition-all"
                :class="isVideoMuted ? 'bg-red-500 hover:bg-red-600' : 'bg-white/20 hover:bg-white/30'">
          <svg x-show="!isVideoMuted" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <svg x-show="isVideoMuted" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
          </svg>
        </button>

        <!-- Screen Share -->
        <button @click="toggleScreenShare()" 
                class="w-12 h-12 rounded-full flex items-center justify-center transition-all"
                :class="isScreenSharing ? 'bg-blue-500 hover:bg-blue-600' : 'bg-white/20 hover:bg-white/30'">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </button>
      </div>

      <!-- Center: Call Duration -->
      <div class="text-white text-sm font-medium">
        <span x-text="formatCallDuration(callDuration)"></span>
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-2">
        <!-- Toggle Chat -->
        <button @click="showChat = !showChat" 
                class="w-12 h-12 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-all">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
          </svg>
        </button>

        <!-- End Call -->
        <button @click="endCall()" 
                class="w-12 h-12 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center transition-all">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Panel -->
  <div x-show="showChat" 
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0 translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-4"
       class="absolute right-4 top-4 bottom-20 w-80 bg-gray-800/95 backdrop-blur-md rounded-xl overflow-hidden flex flex-col">
    <!-- Chat Header -->
    <div class="p-4 border-b border-gray-700">
      <h3 class="text-white font-semibold">Chat</h3>
    </div>
    
    <!-- Chat Messages -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3" ref="chatMessages">
      <template x-for="message in chatMessages" :key="message.id">
        <div class="flex flex-col" :class="message.isSelf ? 'items-end' : 'items-start'">
          <span class="text-xs text-gray-400 mb-1" x-text="message.sender"></span>
          <div class="max-w-[80%] px-3 py-2 rounded-2xl text-sm"
               :class="message.isSelf ? 'bg-blue-500 text-white rounded-br-none' : 'bg-gray-700 text-white rounded-bl-none'">
            <span x-text="message.text"></span>
          </div>
          <span class="text-xs text-gray-500 mt-1" x-text="formatTime(message.timestamp)"></span>
        </div>
      </template>
    </div>
    
    <!-- Chat Input -->
    <div class="p-4 border-t border-gray-700">
      <div class="flex gap-2">
        <input type="text" 
               x-model="newMessage"
               @keydown.enter="sendMessage()"
               placeholder="Écrire un message..."
               class="flex-1 bg-gray-700 text-white text-sm rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
        <button @click="sendMessage()" 
                class="w-10 h-10 rounded-full bg-blue-500 hover:bg-blue-600 flex items-center justify-center transition-all">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function webrtcVideoChat() {
  return {
    connectionStatus: 'disconnected',
    isAudioMuted: false,
    isVideoMuted: false,
    isScreenSharing: false,
    showChat: false,
    callDuration: 0,
    callTimer: null,
    
    localStream: null,
    remoteStream: null,
    peerConnection: null,
    
    chatMessages: [],
    newMessage: '',
    
    async init() {
      try {
        // Get local media stream
        this.localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: true
        });
        
        this.$refs.localVideo.srcObject = this.localStream;
        
        // Initialize WebRTC peer connection
        this.peerConnection = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        });
        
        // Add local tracks to peer connection
        this.localStream.getTracks().forEach(track => {
          this.peerConnection.addTrack(track, this.localStream);
        });
        
        // Handle remote stream
        this.peerConnection.ontrack = (event) => {
          this.remoteStream = event.streams[0];
          this.$refs.remoteVideo.srcObject = this.remoteStream;
        };
        
        // Handle ICE candidates
        this.peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            // Send ICE candidate to signaling server
            this.sendSignal({ type: 'ice-candidate', candidate: event.candidate });
          }
        };
        
        // Handle connection state
        this.peerConnection.onconnectionstatechange = () => {
          this.connectionStatus = this.peerConnection.connectionState;
        };
        
        // Start call timer
        this.startCallTimer();
        
        // Simulate connection for demo
        setTimeout(() => {
          this.connectionStatus = 'connected';
        }, 2000);
        
      } catch (error) {
        console.error('Error accessing media devices:', error);
        alert('Impossible d\'accéder aux périphériques média');
      }
    },
    
    toggleAudio() {
      if (this.localStream) {
        const audioTrack = this.localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          this.isAudioMuted = !audioTrack.enabled;
        }
      }
    },
    
    toggleVideo() {
      if (this.localStream) {
        const videoTrack = this.localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          this.isVideoMuted = !videoTrack.enabled;
        }
      }
    },
    
    async toggleScreenShare() {
      try {
        if (!this.isScreenSharing) {
          const screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: 'always' },
            audio: false
          });
          
          const screenTrack = screenStream.getVideoTracks()[0];
          
          // Replace video track with screen share
          const sender = this.peerConnection.getSenders().find(s => 
            s.track.kind === 'video'
          );
          
          if (sender) {
            await sender.replaceTrack(screenTrack);
          }
          
          this.isScreenSharing = true;
          
          // Handle user stopping screen share
          screenTrack.onended = () => {
            this.toggleScreenShare();
          };
          
        } else {
          // Revert to camera
          const videoTrack = this.localStream.getVideoTracks()[0];
          const sender = this.peerConnection.getSenders().find(s => 
            s.track.kind === 'video'
          );
          
          if (sender) {
            await sender.replaceTrack(videoTrack);
          }
          
          this.isScreenSharing = false;
        }
      } catch (error) {
        console.error('Error toggling screen share:', error);
      }
    },
    
    endCall() {
      if (this.peerConnection) {
        this.peerConnection.close();
      }
      
      if (this.localStream) {
        this.localStream.getTracks().forEach(track => track.stop());
      }
      
      if (this.callTimer) {
        clearInterval(this.callTimer);
      }
      
      this.connectionStatus = 'disconnected';
    },
    
    startCallTimer() {
      this.callTimer = setInterval(() => {
        this.callDuration++;
      }, 1000);
    },
    
    formatCallDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    },
    
    sendMessage() {
      if (this.newMessage.trim()) {
        this.chatMessages.push({
          id: Date.now(),
          text: this.newMessage,
          sender: 'Vous',
          isSelf: true,
          timestamp: new Date()
        });
        
        // Send message via signaling server
        this.sendSignal({
          type: 'chat-message',
          message: this.newMessage
        });
        
        this.newMessage = '';
        
        // Scroll to bottom
        this.$nextTick(() => {
          this.$refs.chatMessages.scrollTop = this.$refs.chatMessages.scrollHeight;
        });
      }
    },
    
    formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit'
      });
    },
    
    sendSignal(data) {
      // Send to signaling server via WebSocket or API
      console.log('Sending signal:', data);
      // Implementation depends on your signaling server
    }
  };
}
</script>
