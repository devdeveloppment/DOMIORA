<div x-data="{ 
  isPlaying: false,
  isFullscreen: false,
  currentTime: 0,
  duration: 0,
  volume: 1,
  playbackSpeed: 1,
  showControls: true,
  controlsTimeout: null,
  videoRef: null,
  
  init() {
    this.$nextTick(() => {
      this.videoRef = this.$el.querySelector('video');
      if (this.videoRef) {
        this.videoRef.addEventListener('loadedmetadata', () => {
          this.duration = this.videoRef.duration;
        });
        this.videoRef.addEventListener('timeupdate', () => {
          this.currentTime = this.videoRef.currentTime;
        });
        this.videoRef.addEventListener('play', () => {
          this.isPlaying = true;
        });
        this.videoRef.addEventListener('pause', () => {
          this.isPlaying = false;
        });
      }
    });
  },
  
  togglePlay() {
    if (this.videoRef) {
      if (this.isPlaying) {
        this.videoRef.pause();
      } else {
        this.videoRef.play();
      }
    }
  },
  
  toggleFullscreen() {
    if (this.videoRef) {
      if (this.isFullscreen) {
        document.exitFullscreen();
      } else {
        this.videoRef.requestFullscreen();
      }
    }
  },
  
  seek(time) {
    if (this.videoRef) {
      this.videoRef.currentTime = time;
    }
  },
  
  setVolume(vol) {
    if (this.videoRef) {
      this.videoRef.volume = vol;
      this.volume = vol;
    }
  },
  
  setSpeed(speed) {
    if (this.videoRef) {
      this.videoRef.playbackRate = speed;
      this.playbackSpeed = speed;
    }
  },
  
  formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  },
  
  showControlsTemp() {
    this.showControls = true;
    if (this.controlsTimeout) {
      clearTimeout(this.controlsTimeout);
    }
    this.controlsTimeout = setTimeout(() => {
      if (this.isPlaying) {
        this.showControls = false;
      }
    }, 3000);
  }
}" 
class="relative rounded-2xl overflow-hidden bg-black shadow-2xl group"
@mouseenter="showControlsTemp()"
@mousemove="showControlsTemp()"
@mouseleave="showControls = false"
x-cloak>
  
  <!-- Video Element -->
  <video 
    ref="videoRef"
    src="{{ video_url }}"
    class="w-full h-full object-contain"
    playsinline
    :class="{ 'opacity-0': !isPlaying && currentTime === 0 }"
    @click="togglePlay()"
  ></video>
  
  <!-- Play Button Overlay -->
  <div 
    x-show="!isPlaying && currentTime === 0"
    class="absolute inset-0 flex items-center justify-center bg-black/40 transition-opacity"
    @click="togglePlay()"
  >
    <button class="w-20 h-20 rounded-full bg-white/90 backdrop-blur-md flex items-center justify-center hover:bg-white transition-all shadow-xl transform hover:scale-110">
      <svg class="w-10 h-10 text-gray-900 ml-1" fill="currentColor" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
  </div>
  
  <!-- Controls Bar -->
  <div 
    x-show="showControls"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 translate-y-4"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-4"
    class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-4 space-y-3"
  >
    <!-- Progress Bar -->
    <div class="relative w-full h-1.5 bg-white/30 rounded-full cursor-pointer group/progress">
      <div 
        class="absolute top-0 left-0 h-full bg-gradient-to-r from-purple-500 to-blue-500 rounded-full transition-all"
        :style="{ width: (currentTime / duration * 100) + '%' }"
      ></div>
      <div 
        class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-lg transform scale-0 group-hover/progress:scale-100 transition-transform"
        :style="{ left: (currentTime / duration * 100) + '%' }"
      ></div>
      <input 
        type="range" 
        min="0" 
        :max="duration" 
        step="0.1"
        :value="currentTime"
        @input="seek($event.target.value)"
        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
      >
    </div>
    
    <!-- Controls Row -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Play/Pause -->
        <button 
          @click="togglePlay()"
          class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center hover:bg-white/30 transition-all"
        >
          <svg x-show="!isPlaying" class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg x-show="isPlaying" class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
        </button>
        
        <!-- Time Display -->
        <span class="text-white text-sm font-medium">
          <span x-text="formatTime(currentTime)"></span> / <span x-text="formatTime(duration)"></span>
        </span>
        
        <!-- Volume -->
        <div class="flex items-center gap-2">
          <button @click="setVolume(volume === 0 ? 1 : 0)" class="text-white hover:text-white/80 transition">
            <svg x-show="volume > 0.5" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg x-show="volume > 0 && volume <= 0.5" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>
            </svg>
            <svg x-show="volume === 0" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 .25L18.73 21 20 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input 
            type="range" 
            min="0" 
            max="1" 
            step="0.1"
            :value="volume"
            @input="setVolume($event.target.value)"
            class="w-20 h-1 bg-white/30 rounded-full appearance-none cursor-pointer"
          >
        </div>
        
        <!-- Playback Speed -->
        <select 
          x-model="playbackSpeed"
          @change="setSpeed($event.target.value)"
          class="bg-white/20 backdrop-blur-md text-white text-xs rounded px-2 py-1 border-0 outline-none cursor-pointer"
        >
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- 3D Badge -->
        <span class="bg-gradient-to-r from-purple-500 to-blue-500 text-white text-xs font-bold px-3 py-1 rounded-full">
          🎬 3D
        </span>
        
        <!-- Fullscreen -->
        <button 
          @click="toggleFullscreen()"
          class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center hover:bg-white/30 transition-all"
        >
          <svg x-show="!isFullscreen" class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
          <svg x-show="isFullscreen" class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Loading Indicator -->
  <div x-show="videoRef && videoRef.readyState < 3" class="absolute inset-0 flex items-center justify-center bg-black/50">
    <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
  </div>
</div>
