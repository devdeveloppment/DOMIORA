<form method="get" class="inline-flex items-center gap-2" aria-label="Filtrer par période">
  <label for="periode" class="text-xs font-semibold text-gray-500">Période</label>
  <select id="periode" name="periode" onchange="this.form.submit()"
          class="text-sm border-gray-200 rounded-lg text-gray-700 font-medium py-1.5 pl-3 pr-8 focus:ring-primary-600 focus:border-primary-600">
    {% for key, value in periods.items %}
    <option value="{{ key }}" {% if key == period %}selected{% endif %}>{{ value.0 }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="text-sm font-semibold text-primary-600">OK</button></noscript>
</form>
