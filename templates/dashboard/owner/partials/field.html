{# Champ de formulaire avec libellé, aide et erreurs ; usage : include ... with field=form.title #}
<div>
  <label for="{{ field.id_for_label }}" class="text-sm font-semibold text-gray-700">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text and not field.errors %}<p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="text-xs text-rose-600 mt-1 flex items-start gap-1"><i class="fa-solid fa-circle-exclamation mt-0.5" aria-hidden="true"></i>{{ error }}</p>{% endfor %}
</div>
