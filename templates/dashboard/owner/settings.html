{% extends "dashboard/dashboard_base.html" %}

{% block title %}Paramètres — {{ site_settings.site_name }}{% endblock %}

{% block dashboard_content %}
<div class="w-full">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold font-display text-gray-900">Paramètres du compte</h1>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 min-h-[400px]">
    <div class="max-w-2xl">
      <h2 class="text-lg font-bold text-gray-900 mb-6">Configuration</h2>
      
      <div class="space-y-4">
        <div class="flex items-center justify-between p-4 border border-gray-100 rounded-xl">
          <div>
            <h3 class="font-semibold text-gray-900">Notifications de visite</h3>
            <p class="text-sm text-gray-500">Être alerté pour chaque nouvelle demande</p>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" value="" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
          </label>
        </div>
      </div>
      
      <div class="mt-8 pt-8 border-t border-gray-100">
        <button class="bg-blue-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-blue-700 transition">Enregistrer</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
