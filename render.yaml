services:
  # Mode gratuit Render : le worker Celery (génération des visites virtuelles) tourne dans
  # le même conteneur que le site (voir start.sh). Les Background Workers Render n'ont pas
  # d'offre gratuite. Pour passer en mode dédié plus tard : service "worker" séparé
  # (startCommand: celery -A config worker --loglevel=info --concurrency=1) et startCommand
  # web = gunicorn seul.
  - type: web
    name: domiora
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    # L'application mobile (Flutter) est dans le même dépôt mais n'est jamais compilée ni déployée
    # sur Render : un commit qui ne touche que mobile/ ne redéploie pas le site.
    buildFilter:
      ignoredPaths:
        - mobile/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Base PostgreSQL externe (Neon, Supabase...) : coller l'URL de connexion complète.
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Paiements FedaPay (mode par défaut en production). Laisser FEDAPAY_SANDBOX à True
      # tant que les clés de test sont utilisées.
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_SANDBOX
        value: "True"
      # Envoi des e-mails (mot de passe d'application Gmail).
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Assistant IA du site.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Instance gratuite (512 Mo, CPU partagé) : rendu plus léger que le 720p par défaut.
      - key: VIRTUAL_TOUR_RESOLUTION
        value: 854x480
      - key: VIRTUAL_TOUR_FPS
        value: "20"

  # Pas de Redis : Render limite à une instance Key Value gratuite par compte. Celery utilise
  # le broker filesystem, valable car le worker tourne dans le même conteneur (start.sh).
  # Serveur MCP (mcp_server/) non déployé pour l'instant : le site n'en dépend pas.
