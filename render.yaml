services:
  # Mode gratuit Render : le worker Celery (génération des visites virtuelles) tourne dans
  # le même conteneur que le site (voir start.sh). Les Background Workers Render n'ont pas
  # d'offre gratuite. Pour passer en mode dédié plus tard : service "worker" séparé
  # (startCommand: celery -A config worker --loglevel=info --concurrency=1) et startCommand
  # web = gunicorn seul.
  - type: web
    name: domiora
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: domiora-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: domiora-redis
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: BASE_URL
        value: https://domiora.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://domiora.onrender.com
      # Paiements FedaPay (mode par défaut en production). Laisser FEDAPAY_SANDBOX à True
      # tant que les clés de test sont utilisées.
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_SANDBOX
        value: "True"
      # Envoi des e-mails (mot de passe d'application Gmail).
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Assistant IA du site.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Instance gratuite (512 Mo, CPU partagé) : rendu plus léger que le 720p par défaut.
      - key: VIRTUAL_TOUR_RESOLUTION
        value: 854x480
      - key: VIRTUAL_TOUR_FPS
        value: "20"

  # Broker Celery (Render Key Value / Redis), offre gratuite, accès interne uniquement.
  - type: keyvalue
    name: domiora-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # Serveur MCP (mcp_server/) non déployé pour l'instant : le site n'en dépend pas.

databases:
  - name: domiora-db
    plan: free
